<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .profile-form {
            display: grid;
            gap: 20px;
        }

        .form-group {
            display: grid;
            gap: 8px;
        }

        .form-group label {
            font-weight: 500;
            color: #333;
        }

        .form-group input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        .form-group input:disabled {
            background-color: #f5f5f5;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .edit-btn, .save-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .edit-btn {
            background-color: #3498db;
            color: white;
        }

        .save-btn {
            background-color: #2ecc71;
            color: white;
        }

        .back-btn {
            padding: 8px 16px;
            background: none;
            border: 1px solid #3498db;
            color: #3498db;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <h1>Profile Settings</h1>
            <button class="back-btn" onclick="window.location.href='landingpage.html'">
                <span class="material-icons">arrow_back</span> Back
            </button>
        </div>
        
        <form id="profile-form" class="profile-form">
            <div class="form-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" disabled>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" disabled>
            </div>
            
            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" id="country" disabled>
            </div>
            
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" disabled>
            </div>
            
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" disabled>
            </div>
            
            <div class="button-group">
                <button type="button" class="edit-btn" id="editBtn">Edit Profile</button>
                <button type="submit" class="save-btn" id="saveBtn" style="display: none;">Save Changes</button>
            </div>
        </form>
    </div>

    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                window.location.href = 'landingpage.html';
                return;
            }

            // Populate form fields
            Object.keys(currentUser).forEach(key => {
                const input = document.getElementById(key);
                if (input) {
                    input.value = currentUser[key];
                }
            });

            // Handle edit mode
            const editBtn = document.getElementById('editBtn');
            const saveBtn = document.getElementById('saveBtn');
            const form = document.getElementById('profile-form');
            const inputs = form.querySelectorAll('input:not([id="userId"]):not([id="email"])');

            editBtn.addEventListener('click', () => {
                inputs.forEach(input => input.disabled = false);
                editBtn.style.display = 'none';
                saveBtn.style.display = 'block';
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Update user data
                const updatedUser = { ...currentUser };
                inputs.forEach(input => {
                    updatedUser[input.id] = input.value;
                });

                // Update in localStorage
                localStorage.setItem('currentUser', JSON.stringify(updatedUser));

                // Update in users array
                const users = JSON.parse(localStorage.getItem('users')) || [];
                const userIndex = users.findIndex(u => u.userId === currentUser.userId);
                if (userIndex !== -1) {
                    users[userIndex] = updatedUser;
                    localStorage.setItem('users', JSON.stringify(users));
                }

                // Show success message
                alert('Profile updated successfully!');

                // Reset form state
                inputs.forEach(input => input.disabled = true);
                editBtn.style.display = 'block';
                saveBtn.style.display = 'none';
            });
        });
    </script>
</body>
</html>
