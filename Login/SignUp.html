<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login And Registration Form</title>
    <link rel="stylesheet" href="Login_signup.css">
    
</head>
<body>
    <div class="hero">
        <div class="form-box">
            <div class="button-box">
                <div id="btn"></div>
                <button type="button" class="toggle-btn" onclick="login()">Log In</button>
                <button type="button" class="toggle-btn" onclick="register()">Register</button>
            </div>
            <div class="social-icons">
                <img src="fb.png" alt="Facebook">
                <img src="x.png" alt="Twitter">
                <img src="gp.png" alt="Google">
            </div>

            <form id="login" class="input-group">
                <input type="text" name="userId" class="input-field" placeholder="User Id" required>
                <input type="password" name="password" class="input-field" placeholder="Enter Password" required>
                <label class="remember-label">
                    <input type="checkbox" class="check-box">
                    <span>Remember Password</span>
                </label>
                <button type="submit" class="submit-btn">Log In</button>
            </form>

            <form id="register" class="input-group">
                <input type="text" name="userId" class="input-field" placeholder="User Id" required>
                <input type="text" name="country" class="input-field" placeholder="Country" required>
                <input type="date" name="dob" class="input-field" required>
                <input type="number" name="age" class="input-field" placeholder="Age" required>
                <input type="email" name="email" class="input-field" placeholder="Email" required>
                <input type="password" name="password" class="input-field" placeholder="Enter Password" required>
                <input type="password" name="confirmPassword" class="input-field" placeholder="Confirm Password" required>
                <label class="terms-label">
                    <input type="checkbox" class="check-box" required>
                    <span>I agree to the terms and conditions</span>
                </label>
                <button type="submit" class="submit-btn">Register</button>
            </form>
        </div>
    </div>
    <script src="../Admin/auth.js"></script>
    <script>
        var x = document.getElementById("login");
        var y = document.getElementById("register");
        var z = document.getElementById("btn");

        function register() {
            x.style.left = "-400px";
            y.style.left = "50px";
            z.style.left = "110px";
        }
        function login() {
            x.style.left = "50px";
            y.style.left = "450px";
            z.style.left = "0";
        }

        const loginForm = document.getElementById('login');
        const registerForm = document.getElementById('register');

        if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (window.auth) {
                    auth.handleLogin(e);
                }
            });
        }

        if (registerForm) {
            registerForm.addEventListener('submit', (e) => {
                e.preventDefault();
                if (window.auth) {
                    auth.handleRegistration(e);
                }
            });
        }
    </script>
</body>
</html>
